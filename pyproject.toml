[project]
name = "agent-handoff-check"
version = "0.1.0"
description = "Checks every agent-to-agent handoff and the tool call at the end: ACT, ESCALATE or BLOCK, so no agent can do more than the customer authorized. Deterministic, blind-evaluated."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
agent-handoff-check = "agent_handoff_check.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_handoff_check"]
